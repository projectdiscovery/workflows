name: "💤 Stale"

# Reusable workflow: marks issues and pull requests stale after 90 days
# without activity and closes them 7 days later. Any new activity removes
# the stale label and restarts the count.
#
# Issues labeled "Type: Enhancement" are exempt. A feature request usually
# waits on maintainers rather than on its reporter, so inactivity does not
# mean it is resolved. Pull requests have no exemption.
#
# Usage:
#
#   on:
#     schedule:
#       - cron: '0 0 * * 0'
#     workflow_dispatch:
#
#   jobs:
#     stale:
#       uses: projectdiscovery/workflows/.github/workflows/stale.yaml@v1
#       permissions:
#         actions: write
#         issues: write
#         pull-requests: write

on:
  workflow_call:

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-latest
    # The caller's token must allow at least these permissions: a called
    # workflow can keep or reduce its caller's GITHUB_TOKEN permissions but
    # cannot raise them.
    permissions:
      actions: write # actions/stale deletes its previous state cache entry before saving a new one
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 90
          days-before-close: 7
          stale-issue-label: 'Status: Stale'
          stale-pr-label: 'Status: Stale'
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed in 7 days if no further
            activity occurs. Thank you for your contributions!
          stale-pr-message: >
            This pull request has been automatically marked as stale due to
            inactivity. It will be closed in 7 days if no further activity
            occurs. Please update if you wish to keep it open.
          close-issue-message: >
            This issue has been automatically closed due to inactivity. If you
            think this is a mistake or would like to continue the discussion,
            please comment or feel free to reopen it.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity.
            If you think this is a mistake or would like to continue working on
            it, please comment or feel free to reopen it.
          close-issue-label: 'Status: Abandoned'
          close-pr-label: 'Status: Abandoned'
          exempt-issue-labels: 'Type: Enhancement'
